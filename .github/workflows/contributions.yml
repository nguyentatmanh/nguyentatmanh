name: Update contribution playground

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/contributions.yml'
      - 'scripts/contribution_stats.py'

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Fetch and validate owner contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/contribution_stats.py
      - name: Generate vibrant neon contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN }}
          outputs: |
            assets/github-snake.svg?color_snake=#ff0055&color_dots=#ebedf0,#93c5fd,#818cf8,#c084fc,#f43f5e
            assets/github-snake-dark.svg?color_snake=#00f5d4&color_dots=#161b22,#312e81,#4f46e5,#9333ea,#ec4899
      - name: Enhance snake neon glow effects
        run: python3 scripts/enhance_snake.py
      - name: Save updated artwork
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg assets/github-snake-dark.svg assets/contribution-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution artwork'
            git push origin "HEAD:$PROFILE_BRANCH"
          fi
